# Default configuration for sEMG to angle estimation training

# EMG acquisition parameters
emg_sampling_rate: 1200  # Hz (syncs with 30fps=40 samples/frame, 60fps=20 samples/frame)
emg_channels: 2  # Number of EMG channels (new wiring)
emg_gain: 816.0  # Amplifier gain
emg_ref_voltage: 0.0  # Reference voltage
notch_freq: 50.0  # Power line frequency (Hz)
lpf_cutoff: 488.652  # Low-pass filter cutoff (Hz)

# Video parameters
video_fps: 30  # Video frame rate (30 or 60 fps recommended)

# Model configuration
model_name: mlp  # Options: mlp, cnn, lstm, cnn_lstm, attention
input_channels: 32  # Stacked features (8 features × 4 windows)
sequence_length: 1  # Feature vectors, not raw windows
num_angles: 2  # [p (position), s (speed)]
hidden_dim: 128  # Hidden dimension for models

# Training configuration
num_epochs: 100
batch_size: 32
learning_rate: 0.001
weight_decay: 0.00001
save_freq: 10  # Save checkpoint every N epochs

# Data configuration
train_data_path: data/processed/train
val_data_path: data/processed/val
test_data_path: data/processed/test

# Paths
checkpoint_dir: data/models
log_dir: runs

# Device
device: cuda  # Options: cuda, cpu
input_dim: 32
